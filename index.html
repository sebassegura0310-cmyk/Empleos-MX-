<!-- =========================
     PASO 1 - DATOS DEMO
========================== -->
<section id="paso-1" class="pantalla">

    <div class="tarjeta">

        <h2>¡Continúa ahora!</h2>

        <p class="subtitulo">
            Completa estos datos necesarios
        </p>

        <form id="form-demo">

            <label>
                Nombre completo
            </label>

            <input
                type="text"
                id="nombre"
                placeholder="Ej: María García"
                autocomplete="off"
                required
            >

            <label>
                Teléfono o WhatsApp
            </label>

            <input
                type="tel"
                id="telefono"
                placeholder="Ej: 555 123 4567"
                autocomplete="off"
                required
            >

            <label>
                Ciudad
            </label>

            <input
                type="text"
                id="ciudad"
                placeholder="Ej: Ciudad de México"
                autocomplete="off"
                required
            >

            <button
                type="submit"
                class="boton verde"
            >
                Continuar
                <span>→</span>
            </button>

        </form>

    </div>

</section>
